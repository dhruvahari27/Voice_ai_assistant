[project]
name = "voiceops-agent"
version = "0.2.0"
description = "VoiceOps phone agent: LiveKit handles audio, the VoiceOps API is the receptionist."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Everything needed to take real calls. Install with: uv sync --extra voice
voice = [
  "livekit-agents[deepgram,elevenlabs,sarvam,silero,turn-detector]~=1.2",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
